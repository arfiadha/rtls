<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Security Detector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .detection-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .detection-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            border-left: 4px solid #ddd;
            transition: all 0.3s ease;
        }

        .detection-card.checking {
            border-left-color: #ffc107;
            background: #fff8dc;
        }

        .detection-card.safe {
            border-left-color: #28a745;
            background: #f0fff4;
        }

        .detection-card.warning {
            border-left-color: #ffc107;
            background: #fffbf0;
        }

        .detection-card.danger {
            border-left-color: #dc3545;
            background: #fff5f5;
        }

        .detection-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .detection-status {
            font-size: 14px;
            margin-bottom: 10px;
        }

        .detection-details {
            font-size: 12px;
            color: #666;
            background: rgba(255, 255, 255, 0.7);
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
            width: 100%;
            margin-bottom: 20px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .location-info {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
        }

        .location-info h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .location-data {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 14px;
        }

        .status-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: inline-block;
        }

        .icon-checking { background: #ffc107; }
        .icon-safe { background: #28a745; }
        .icon-warning { background: #ffc107; }
        .icon-danger { background: #dc3545; }

        .spinner {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .alert-danger {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .alert-warning {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
        }

        .alert-success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛡️ Location Security Detector</h1>
            <p>Deteksi lokasi palsu, mock location, dan developer options</p>
        </div>

        <button class="btn" id="startDetection" onclick="startFullDetection()">
            🔍 Mulai Deteksi Keamanan
        </button>

        <div class="detection-grid">
            <div class="detection-card" id="gpsCard">
                <div class="detection-title">
                    <span class="status-icon" id="gpsIcon"></span>
                    📍 Deteksi GPS & Lokasi
                </div>
                <div class="detection-status" id="gpsStatus">Menunggu deteksi...</div>
                <div class="detection-details" id="gpsDetails"></div>
            </div>

            <div class="detection-card" id="mockCard">
                <div class="detection-title">
                    <span class="status-icon" id="mockIcon"></span>
                    🎭 Mock Location Detection
                </div>
                <div class="detection-status" id="mockStatus">Menunggu deteksi...</div>
                <div class="detection-details" id="mockDetails"></div>
            </div>

            <div class="detection-card" id="devCard">
                <div class="detection-title">
                    <span class="status-icon" id="devIcon"></span>
                    ⚙️ Developer Options
                </div>
                <div class="detection-status" id="devStatus">Menunggu deteksi...</div>
                <div class="detection-details" id="devDetails"></div>
            </div>

            <div class="detection-card" id="browserCard">
                <div class="detection-title">
                    <span class="status-icon" id="browserIcon"></span>
                    🌐 Browser Security
                </div>
                <div class="detection-status" id="browserStatus">Menunggu deteksi...</div>
                <div class="detection-details" id="browserDetails"></div>
            </div>
        </div>

        <div class="location-info" id="locationInfo" style="display: none;">
            <h3>📊 Informasi Lokasi</h3>
            <div class="location-data" id="locationData"></div>
        </div>
    </div>

    <script>
        let detectionResults = {
            gps: null,
            mock: null,
            developer: null,
            browser: null
        };

        let previousLocations = [];
        let locationHistory = [];

        async function startFullDetection() {
            const btn = document.getElementById('startDetection');
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div> Mendeteksi...';

            // Reset status
            resetDetectionStatus();

            try {
                // Jalankan semua deteksi secara paralel
                await Promise.all([
                    detectGPSLocation(),
                    detectMockLocation(),
                    detectDeveloperOptions(),
                    detectBrowserSecurity()
                ]);

                showFinalResults();
            } catch (error) {
                console.error('Error during detection:', error);
                showAlert('Terjadi kesalahan saat melakukan deteksi', 'danger');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🔍 Mulai Deteksi Ulang';
            }
        }

        function resetDetectionStatus() {
            const cards = ['gps', 'mock', 'dev', 'browser'];
            cards.forEach(card => {
                updateDetectionCard(card, 'checking', 'Sedang memeriksa...', '');
            });
        }

        async function detectGPSLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    detectionResults.gps = {
                        status: 'danger',
                        message: 'Geolocation tidak didukung browser',
                        details: 'Browser ini tidak mendukung API Geolocation'
                    };
                    updateDetectionCard('gps', 'danger', detectionResults.gps.message, detectionResults.gps.details);
                    resolve();
                    return;
                }

                const options = {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                };

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const { coords } = position;
                        const accuracy = coords.accuracy;
                        
                        // Analisis akurasi untuk mendeteksi kemungkinan lokasi palsu
                        let suspicionLevel = 'safe';
                        let message = 'Lokasi GPS terdeteksi normal';
                        let details = `Akurasi: ${accuracy.toFixed(2)}m`;

                        if (accuracy > 1000) {
                            suspicionLevel = 'warning';
                            message = 'Akurasi GPS rendah - mungkin indoor';
                            details += ' (Akurasi sangat rendah)';
                        } else if (accuracy < 5) {
                            suspicionLevel = 'warning';
                            message = 'Akurasi GPS terlalu tinggi - mencurigakan';
                            details += ' (Akurasi terlalu sempurna)';
                        }

                        // Cek konsistensi lokasi
                        if (previousLocations.length > 0) {
                            const lastLocation = previousLocations[previousLocations.length - 1];
                            const distance = calculateDistance(
                                coords.latitude, coords.longitude,
                                lastLocation.lat, lastLocation.lng
                            );
                            
                            if (distance > 100000) { // > 100km dalam waktu singkat
                                suspicionLevel = 'danger';
                                message = 'Perpindahan lokasi tidak wajar';
                                details += ` | Jarak dari lokasi sebelumnya: ${(distance/1000).toFixed(2)}km`;
                            }
                        }

                        previousLocations.push({
                            lat: coords.latitude,
                            lng: coords.longitude,
                            timestamp: Date.now(),
                            accuracy: accuracy
                        });

                        locationHistory.push({
                            timestamp: new Date().toLocaleString(),
                            latitude: coords.latitude.toFixed(6),
                            longitude: coords.longitude.toFixed(6),
                            accuracy: accuracy.toFixed(2) + 'm',
                            altitude: coords.altitude ? coords.altitude.toFixed(2) + 'm' : 'N/A',
                            speed: coords.speed ? coords.speed.toFixed(2) + 'm/s' : 'N/A'
                        });

                        detectionResults.gps = {
                            status: suspicionLevel,
                            message: message,
                            details: details,
                            position: coords
                        };

                        updateDetectionCard('gps', suspicionLevel, message, details);
                        updateLocationInfo();
                        resolve();
                    },
                    (error) => {
                        let message = 'Gagal mendapatkan lokasi GPS';
                        let details = '';

                        switch(error.code) {
                            case error.PERMISSION_DENIED:
                                message = 'Izin lokasi ditolak';
                                details = 'User menolak permintaan akses lokasi';
                                break;
                            case error.POSITION_UNAVAILABLE:
                                message = 'Lokasi tidak tersedia';
                                details = 'Informasi lokasi tidak dapat diperoleh';
                                break;
                            case error.TIMEOUT:
                                message = 'Timeout mendapatkan lokasi';
                                details = 'Permintaan lokasi melebihi batas waktu';
                                break;
                        }

                        detectionResults.gps = {
                            status: 'danger',
                            message: message,
                            details: details
                        };

                        updateDetectionCard('gps', 'danger', message, details);
                        resolve();
                    },
                    options
                );
            });
        }

        async function detectMockLocation() {
            return new Promise((resolve) => {
                let suspiciousFactors = [];
                let mockProbability = 0;

                // Test 1: Cek konsistensi waktu lokasi
                if (navigator.geolocation) {
                    const startTime = Date.now();
                    
                    navigator.geolocation.getCurrentPosition(
                        (position1) => {
                            const time1 = Date.now();
                            
                            // Minta lokasi lagi dengan interval singkat
                            setTimeout(() => {
                                navigator.geolocation.getCurrentPosition(
                                    (position2) => {
                                        const time2 = Date.now();
                                        
                                        // Analisis pola waktu respons
                                        const responseTime1 = time1 - startTime;
                                        const responseTime2 = time2 - (time1 + 100);
                                        
                                        if (responseTime1 < 50 || responseTime2 < 50) {
                                            suspiciousFactors.push('Waktu respons GPS terlalu cepat');
                                            mockProbability += 30;
                                        }

                                        // Cek apakah koordinat persis sama
                                        if (position1.coords.latitude === position2.coords.latitude &&
                                            position1.coords.longitude === position2.coords.longitude) {
                                            suspiciousFactors.push('Koordinat identik pada pembacaan berulang');
                                            mockProbability += 25;
                                        }

                                        // Cek akurasi yang tidak realistis
                                        if (position1.coords.accuracy < 3) {
                                            suspiciousFactors.push('Akurasi GPS terlalu tinggi');
                                            mockProbability += 20;
                                        }

                                        finalizeMockDetection();
                                    },
                                    () => finalizeMockDetection(),
                                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                                );
                            }, 100);
                        },
                        () => finalizeMockDetection(),
                        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                    );
                } else {
                    finalizeMockDetection();
                }

                function finalizeMockDetection() {
                    // Test tambahan: Deteksi Developer Tools
                    if (isDevToolsOpen()) {
                        suspiciousFactors.push('Developer Tools terdeteksi terbuka');
                        mockProbability += 15;
                    }

                    // Test: Deteksi virtual environment
                    if (detectVirtualEnvironment()) {
                        suspiciousFactors.push('Kemungkinan berjalan di virtual environment');
                        mockProbability += 20;
                    }

                    let status = 'safe';
                    let message = 'Tidak terdeteksi mock location';
                    let details = 'Lokasi tampak authentic';

                    if (mockProbability >= 70) {
                        status = 'danger';
                        message = 'Mock location sangat mungkin aktif';
                        details = suspiciousFactors.join(' | ');
                    } else if (mockProbability >= 40) {
                        status = 'warning';
                        message = 'Kemungkinan mock location terdeteksi';
                        details = suspiciousFactors.length > 0 ? suspiciousFactors.join(' | ') : 'Beberapa indikator mencurigakan';
                    }

                    detectionResults.mock = {
                        status: status,
                        message: message,
                        details: details + ` (Skor: ${mockProbability}%)`
                    };

                    updateDetectionCard('mock', status, message, detectionResults.mock.details);
                    resolve();
                }
            });
        }

        function detectDeveloperOptions() {
            return new Promise((resolve) => {
                let devIndicators = [];
                let devScore = 0;
                let webLimitations = [];

                // KETERBATASAN: Web browser tidak bisa mendeteksi Android Developer Options secara langsung
                webLimitations.push('Browser tidak dapat mengakses Android Developer Options');

                // Test 1: Deteksi DevTools (akurat untuk web)
                const devToolsResult = detectDevTools();
                if (devToolsResult.isOpen) {
                    devIndicators.push(`Developer Tools: ${devToolsResult.method}`);
                    devScore += 35;
                }

                // Test 2: Deteksi debugging environment
                if (isDebuggingEnvironment()) {
                    devIndicators.push('Environment debugging terdeteksi');
                    devScore += 25;
                }

                // Test 3: Deteksi automation/testing tools
                const automationResult = detectAutomationTools();
                if (automationResult.detected) {
                    devIndicators.push(`Automation tools: ${automationResult.tools.join(', ')}`);
                    devScore += 40;
                }

                // Test 4: Deteksi emulator/virtual device (terbatas)
                const emulatorResult = detectEmulatorSignature();
                if (emulatorResult.suspected) {
                    devIndicators.push(`Kemungkinan emulator: ${emulatorResult.reasons.join(', ')}`);
                    devScore += 30;
                }

                // Test 5: Console/API manipulation check
                if (isConsoleOrAPITampered()) {
                    devIndicators.push('Browser API dimodifikasi');
                    devScore += 20;
                }

                // Test 6: Performance timing anomalies (bisa indikasi debugging)
                if (hasPerformanceAnomalies()) {
                    devIndicators.push('Anomali performa terdeteksi');
                    devScore += 15;
                }

                let status = 'warning'; // Default warning karena keterbatasan web
                let message = 'Deteksi terbatas - gunakan aplikasi native untuk akurasi penuh';
                let details = webLimitations.join(' | ');

                if (devScore >= 50) {
                    status = 'danger';
                    message = 'Development environment terdeteksi';
                    details = devIndicators.join(' | ');
                } else if (devScore >= 20) {
                    status = 'warning';
                    message = 'Beberapa indikator development terdeteksi';
                    details = devIndicators.length > 0 ? devIndicators.join(' | ') : 'Deteksi terbatas di web browser';
                } else if (devIndicators.length === 0) {
                    status = 'warning';
                    message = 'Tidak dapat mendeteksi Android Developer Options';
                    details = 'Web browser memiliki keterbatasan akses ke pengaturan sistem';
                }

                detectionResults.developer = {
                    status: status,
                    message: message,
                    details: details + (devScore > 0 ? ` (Skor: ${devScore}%)` : ''),
                    limitations: webLimitations
                };

                updateDetectionCard('dev', status, message, detectionResults.developer.details);
                resolve();
            });
        }

        function detectBrowserSecurity() {
            return new Promise((resolve) => {
                let securityIssues = [];
                let securityScore = 100;

                // Test 1: HTTPS Check
                if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
                    securityIssues.push('Tidak menggunakan HTTPS');
                    securityScore -= 30;
                }

                // Test 2: Mixed Content
                if (hasMixedContent()) {
                    securityIssues.push('Mixed content terdeteksi');
                    securityScore -= 20;
                }

                // Test 3: Browser Integrity
                if (!isBrowserIntegrityGood()) {
                    securityIssues.push('Integritas browser mencurigakan');
                    securityScore -= 25;
                }

                // Test 4: Geolocation API tampering
                if (isGeolocationTampered()) {
                    securityIssues.push('Geolocation API mungkin dimodifikasi');
                    securityScore -= 40;
                }

                let status = 'safe';
                let message = 'Browser security normal';
                let details = 'Tidak ada masalah keamanan terdeteksi';

                if (securityScore < 50) {
                    status = 'danger';
                    message = 'Masalah keamanan serius terdeteksi';
                    details = securityIssues.join(' | ');
                } else if (securityScore < 80) {
                    status = 'warning';
                    message = 'Beberapa masalah keamanan ringan';
                    details = securityIssues.length > 0 ? securityIssues.join(' | ') : 'Keamanan bisa ditingkatkan';
                }

                detectionResults.browser = {
                    status: status,
                    message: message,
                    details: details + ` (Skor: ${securityScore}%)`
                };

                updateDetectionCard('browser', status, message, detectionResults.browser.details);
                resolve();
            });
        }

        // Helper Functions
        function isDevToolsOpen() {
            const threshold = 160;
            return window.outerHeight - window.innerHeight > threshold ||
                   window.outerWidth - window.innerWidth > threshold;
        }

        function isDebuggerPresent() {
            try {
                const start = new Date().getTime();
                debugger;
                const end = new Date().getTime();
                return end - start > 100;
            } catch (e) {
                return false;
            }
        }

        function isConsoleTampered() {
            return typeof console.log !== 'function' || 
                   console.log.toString().indexOf('native code') === -1;
        }

        function isMobileDeveloperMode() {
            const ua = navigator.userAgent;
            // Deteksi emulator atau debugging mode
            return /Android.*Debug|iPhone.*Debug/i.test(ua) ||
                   window.DeviceMotionEvent === undefined && /Mobile/i.test(ua);
        }

        function hasSuspiciousExtensions() {
            // Cek extension yang umum digunakan untuk spoofing
            return document.querySelectorAll('*[data-extension]').length > 0 ||
                   window.chrome && Object.keys(window.chrome).length > 5;
        }

        function detectVirtualEnvironment() {
            const ua = navigator.userAgent;
            return /HeadlessChrome|PhantomJS|Selenium|WebDriver/i.test(ua);
        }

        function hasMixedContent() {
            const scripts = document.querySelectorAll('script[src]');
            const links = document.querySelectorAll('link[href]');
            
            for (let script of scripts) {
                if (script.src && script.src.startsWith('http://')) return true;
            }
            for (let link of links) {
                if (link.href && link.href.startsWith('http://')) return true;
            }
            return false;
        }

        function isBrowserIntegrityGood() {
            return typeof window.navigator !== 'undefined' &&
                   typeof window.location !== 'undefined' &&
                   typeof window.document !== 'undefined';
        }

        function isGeolocationTampered() {
            if (!navigator.geolocation) return false;
            
            const originalToString = Function.prototype.toString;
            try {
                const geolocationString = navigator.geolocation.getCurrentPosition.toString();
                return !geolocationString.includes('[native code]');
            } catch (e) {
                return true;
            }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Earth's radius in meters
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;

            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

            return R * c;
        }

        function updateDetectionCard(cardType, status, message, details) {
            const card = document.getElementById(`${cardType}Card`);
            const icon = document.getElementById(`${cardType}Icon`);
            const statusEl = document.getElementById(`${cardType}Status`);
            const detailsEl = document.getElementById(`${cardType}Details`);

            card.className = `detection-card ${status}`;
            icon.className = `status-icon icon-${status}`;
            statusEl.textContent = message;
            detailsEl.textContent = details;
        }

        function updateLocationInfo() {
            const locationInfo = document.getElementById('locationInfo');
            const locationData = document.getElementById('locationData');
            
            if (locationHistory.length > 0) {
                const latest = locationHistory[locationHistory.length - 1];
                locationData.innerHTML = `
                    <div><strong>Waktu:</strong> ${latest.timestamp}</div>
                    <div><strong>Latitude:</strong> ${latest.latitude}</div>
                    <div><strong>Longitude:</strong> ${latest.longitude}</div>
                    <div><strong>Akurasi:</strong> ${latest.accuracy}</div>
                    <div><strong>Ketinggian:</strong> ${latest.altitude}</div>
                    <div><strong>Kecepatan:</strong> ${latest.speed}</div>
                `;
                locationInfo.style.display = 'block';
            }
        }

        function showFinalResults() {
            const results = Object.values(detectionResults);
            const dangerCount = results.filter(r => r && r.status === 'danger').length;
            const warningCount = results.filter(r => r && r.status === 'warning').length;

            let alertClass = 'alert-success';
            let alertMessage = '✅ Semua pemeriksaan keamanan lolos. Lokasi tampak authentic.';

            if (dangerCount > 0) {
                alertClass = 'alert-danger';
                alertMessage = `⚠️ ${dangerCount} masalah serius terdeteksi! Lokasi mungkin tidak authentic.`;
            } else if (warningCount > 0) {
                alertClass = 'alert-warning';
                alertMessage = `⚡ ${warningCount} indikator mencurigakan terdeteksi. Perlu investigasi lebih lanjut.`;
            }

            showAlert(alertMessage, alertClass.replace('alert-', ''));
        }

        function showAlert(message, type) {
            const existingAlert = document.querySelector('.alert');
            if (existingAlert) {
                existingAlert.remove();
            }

            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;

            const container = document.querySelector('.container');
            container.insertBefore(alert, container.children[2]);
        }

        // Auto-start detection when page loads
        window.addEventListener('load', () => {
            setTimeout(startFullDetection, 1000);
        });
    </script>
</body>
</html>
